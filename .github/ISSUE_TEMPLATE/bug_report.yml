name: Bug report
description: Something in the app is broken, wrong or crashes
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        The more specific you are, the faster it gets fixed. If it involves one
        particular instance or mod, naming it helps a lot.

  - type: checkboxes
    id: checked
    attributes:
      label: Before reporting
      options:
        - label: I searched the existing issues and this has not been reported
          required: true
        - label: I am on the newest release, or the problem is in the newest release
          required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > Updates shows the installed version.
      placeholder: 0.1.1
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer (Setup.exe)
        - Portable (Portable.exe)
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Something else
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      description: Pick everything that applies.
      multiple: true
      options:
        - Finding instances
        - Overview
        - Mods
        - Dependencies
        - Configs
        - Storage
        - Resource packs
        - Screenshots
        - Settings
        - Updates and changelog
        - Export list
        - Somewhere else
    validations:
      required: true

  - type: dropdown
    id: launcher
    attributes:
      label: Which launcher is the instance from?
      description: Skip if it is not about one particular instance.
      multiple: true
      options:
        - Prism Launcher
        - MultiMC
        - CurseForge
        - Modrinth
        - ATLauncher
        - GDLauncher
        - FTB App
        - Technic
        - Vanilla launcher
        - Dedicated server
        - A folder I added by hand

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did the app do?
      placeholder: The mods tab showed 0 mods even though the folder has 94 jars in it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: Numbered steps if you can. "It happens every time I open X" is fine too.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Most of the time
        - Once or twice
        - Only happened once
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images straight into this box. Mod names, instance names and error text all help.
